name: Deploy current GymProgres Web safely

on:
  pull_request:
    branches:
      - main
    paths:
      - 'DEPLOY_CURRENT_WEB_TRIGGER.txt'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout stable production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download validated current Web artifact
        run: |
          curl --fail --location --retry 3 \
            'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-a250-820a-b10d-bfff19ff9cf0/raw?se=2026-08-12T19%3A10%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=1bc1065b-4d86-5bcb-8455-d2004efb9aef&skoid=76024c37-11e2-4c92-aa07-7e519fbe2d0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-12T06%3A53%3A50Z&ske=2026-08-13T06%3A53%3A50Z&sks=b&skv=2026-02-06&sig=ZbbDFoj3H7FqXP689i07qoPl66dTojeIgMScCDcAjJQ%3D' \
            --output /tmp/gymprogres-web.zip
          rm -rf /tmp/gymprogres-web
          mkdir -p /tmp/gymprogres-web
          unzip -q /tmp/gymprogres-web.zip -d /tmp/gymprogres-web
          test -s /tmp/gymprogres-web/index.html
          test -s /tmp/gymprogres-web/main.dart.js
          grep -q 'GymProgres 0.24.4 (build 70)' /tmp/gymprogres-web/main.dart.js
          grep -q 'Trener Pro+' /tmp/gymprogres-web/main.dart.js
          grep -q 'Trener Studio' /tmp/gymprogres-web/main.dart.js
          grep -q '25.99' /tmp/gymprogres-web/main.dart.js
          grep -q '49.99' /tmp/gymprogres-web/main.dart.js
          grep -q '89.99' /tmp/gymprogres-web/main.dart.js
          grep -q '119.99' /tmp/gymprogres-web/main.dart.js
          grep -q 'Panel administratora' /tmp/gymprogres-web/main.dart.js
          grep -q 'Session restore timed out on Web' /tmp/gymprogres-web/main.dart.js
          grep -q 'exercise-last/bulk' /tmp/gymprogres-web/main.dart.js

      - name: Overlay new app files and preserve Pages configuration
        run: |
          cp -a /tmp/gymprogres-web/. .
          rm -f WEB_REPAIR_VALIDATION.txt DEPLOY_CURRENT_WEB_TRIGGER.txt
          printf '%s\n' 'app.gymprogres.pl' > CNAME
          touch .nojekyll
          test -s index.html
          test -s main.dart.js
          test -d .github
          test "$(cat CNAME)" = 'app.gymprogres.pl'

      - name: Commit current Web features
        run: |
          git config user.name 'GymProgres CI'
          git config user.email 'dzienniktreningowy.app@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to deploy.'
            exit 0
          fi
          git commit -m 'Web: sync audited V34 release source'
          git push origin HEAD:main
