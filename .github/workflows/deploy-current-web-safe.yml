name: Deploy current GymProgres Web safely

on:
  push:
    branches:
      - deploy-current-web-safe-final
    paths:
      - '.github/workflows/deploy-current-web-safe.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout stable production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download validated current Web artifact
        run: |
          curl --fail --location --retry 3 \
            'https://sdmntprnortheu.oaiusercontent.com/files/00000000-6918-81f4-aa4a-fc8bf3519485/raw?se=2026-08-10T20%3A48%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=c68953ce-1235-5040-a13c-51d5fad146ea&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-10T05%3A05%3A43Z&ske=2026-08-11T05%3A05%3A43Z&sks=b&skv=2026-02-06&sig=LxIRnZxAw7qqaaAd8n8oRKUUfHihws05qkOKguWhmLA%3D' \
            --output /tmp/gymprogres-web.zip
          rm -rf /tmp/gymprogres-web
          mkdir -p /tmp/gymprogres-web
          unzip -q /tmp/gymprogres-web.zip -d /tmp/gymprogres-web
          test -s /tmp/gymprogres-web/index.html
          test -s /tmp/gymprogres-web/main.dart.js
          grep -q 'Trener Pro+' /tmp/gymprogres-web/main.dart.js
          grep -q 'Panel administratora' /tmp/gymprogres-web/main.dart.js

      - name: Overlay new app files without deleting stable Pages files
        run: |
          cp -a /tmp/gymprogres-web/. .
          rm -f WEB_REPAIR_VALIDATION.txt
          printf '%s\n' 'app.gymprogres.pl' > CNAME
          touch .nojekyll
          test -s index.html
          test -s main.dart.js
          test -d .github

      - name: Commit safe Web update
        run: |
          git config user.name 'GymProgres CI'
          git config user.email 'dzienniktreningowy.app@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to deploy.'
            exit 0
          fi
          git commit -m 'Web: current prices and admin, keep registration disabled'
          git push origin HEAD:main
