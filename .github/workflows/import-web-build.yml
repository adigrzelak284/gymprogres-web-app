name: Import GymProgres Web 0.24.20+1103

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-web-build.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gymprogres-web-import-02420-1103
  cancel-in-progress: false

jobs:
  import-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production Web repo
        uses: actions/checkout@v4

      - name: Download verified GymProgres Web artifact
        env:
          BUILD_URL: 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-5eb4-820a-93d1-5da6057c7eb9/raw?se=2026-09-10T15%3A29%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=caaf0023-fcc6-5fa7-9e0e-0ab8ab9c2bd3&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-10T06%3A25%3A47Z&ske=2026-09-11T06%3A25%3A47Z&sks=b&skv=2026-02-06&sig=EQDdZlhovrMjj3cYEwVCuWMIfuw1yQdaYGQXeadO%2Brw%3D'
        run: |
          curl --fail --location --retry 3 "$BUILD_URL" -o /tmp/gymprogres-web-02420.zip
          echo 'cd9c8fd2e9c7c0714ef615ae712d5fa72e93b9c46bd1f5002dbcbcc47a26ea4d  /tmp/gymprogres-web-02420.zip' | sha256sum -c -

      - name: Replace production package
        run: |
          rm -rf /tmp/gymprogres-web-02420
          mkdir -p /tmp/gymprogres-web-02420
          unzip -q /tmp/gymprogres-web-02420.zip -d /tmp/gymprogres-web-02420
          test -s /tmp/gymprogres-web-02420/main.dart.js
          test -s /tmp/gymprogres-web-02420/index.html
          test -f /tmp/gymprogres-web-02420/GYMPROGRES_BUILD.txt
          grep -F 'Commit: 61e419908e0deddf3f2967ac7a354446f4a909c7' /tmp/gymprogres-web-02420/GYMPROGRES_BUILD.txt
          grep -F 'RELEASE 0.24.20+1103' /tmp/gymprogres-web-02420/GYMPROGRES_BUILD.txt
          test "$(cat /tmp/gymprogres-web-02420/CNAME)" = 'app.gymprogres.pl'

          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf -- {} +
          cp -a /tmp/gymprogres-web-02420/. .
          rm -f .github/workflows/import-web-build.yml

      - name: Commit production Web build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy GymProgres Web 0.24.20+1103 (61e41990)'
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy production Web
        id: deployment
        uses: actions/deploy-pages@v4
