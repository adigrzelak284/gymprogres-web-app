name: Import final GymProgres Web build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-web-build.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gymprogres-web-import-final
  cancel-in-progress: false

jobs:
  import-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production Web repo
        uses: actions/checkout@v4

      - name: Download verified final Web artifact
        env:
          BUILD_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-1c4c-81f4-9b3e-af7b472aeee8/raw?se=2026-09-04T11%3A45%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=8435a25a-4695-59c1-9cd4-3958c97df6a1&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T07%3A42%3A51Z&ske=2026-09-05T07%3A42%3A51Z&sks=b&skv=2026-02-06&sig=A2v/HxyzgvAYyIK5QrHmDSa71V%2BhrVYboVzPiTKPnI4%3D'
        run: |
          curl --fail --location --retry 3 "$BUILD_URL" -o /tmp/gymprogres-web-final.zip
          echo 'f0fb1839bac1eac8aeb2959b9ec81671b427db9e9a0153172f70f05730c72a6e  /tmp/gymprogres-web-final.zip' | sha256sum -c -

      - name: Replace production package
        run: |
          rm -rf /tmp/gymprogres-web-final
          mkdir -p /tmp/gymprogres-web-final
          unzip -q /tmp/gymprogres-web-final.zip -d /tmp/gymprogres-web-final
          test -f /tmp/gymprogres-web-final/main.dart.js
          test -f /tmp/gymprogres-web-final/GYMPROGRES_BUILD.txt
          grep -F 'Commit: 106a76949a6acbdeee2a355ed30e346a6242dfc3' /tmp/gymprogres-web-final/GYMPROGRES_BUILD.txt
          grep -F 'independent Web onboarding state' /tmp/gymprogres-web-final/GYMPROGRES_BUILD.txt

          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf -- {} +
          cp -a /tmp/gymprogres-web-final/. .
          rm -f .github/workflows/import-web-build.yml

      - name: Commit final production Web build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy final GymProgres Web 0.24.19+1102 (106a7694)'
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload final Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy final production Web
        id: deployment
        uses: actions/deploy-pages@v4