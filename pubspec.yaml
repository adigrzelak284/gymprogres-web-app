publish_to: none
version: 0.17.9+40
environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.10.0
  flutter_secure_storage: ^10.3.1
  web: ^1.1.1
  intl: ^0.20.2
  fl_chart: ^1.2.0
  file_picker: ^11.0.2
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
